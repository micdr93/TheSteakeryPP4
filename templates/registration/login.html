{% extends 'base.html' %}

{% load static %} 

{% block content %}<div class="container mt-5 d-flex justify-content-center">
    <div class="row w-100">
        <div class="col-md-6 mx-auto">
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-primary w-100">Log In</button>
            </form>
            <br>
            <p> Don't have an account? <a href="{% url 'signup' %}">Sign up</a></p>
        </div>
    </div>
</div>

{% endblock %}

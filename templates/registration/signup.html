{% extends 'base.html' %}

{% load static %} 

{% block content %}
<div class="container mt-5 d-flex justify-content-center">
    <div class="col-md-6">
        <h2>Sign Up</h2>
        <be></br>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary">Sign Up</button>
        </form>
        <p>Already have an account? <a href="{% url 'login' %}">Log in</a></p>
    </div>
</div>
{% endblock %}
